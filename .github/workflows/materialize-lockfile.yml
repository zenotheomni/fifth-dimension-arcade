name: materialize-package-lock
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/lock.b64.part0'
      - 'scripts/lock.b64.part1'
      - '.github/workflows/materialize-lockfile.yml'
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode lockfile
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          p0 = pathlib.Path('scripts/lock.b64.part0').read_text().strip()
          p1 = pathlib.Path('scripts/lock.b64.part1').read_text().strip()
          data = gzip.decompress(base64.b64decode(p0 + p1))
          pathlib.Path('package-lock.json').write_bytes(data)
          print('wrote', len(data), 'bytes')
          PY
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore: commit full package-lock.json for reproducible Vercel installs"
          git push
